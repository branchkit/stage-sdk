name: Publish to crates.io

# Credential-free publishing: crates.io Trusted Publishing exchanges GitHub's
# short-lived OIDC token for a scoped registry token at job time. No API token
# lives in this repo, in GitHub secrets, or on a laptop — which is why
# `id-token: write` below is load-bearing rather than boilerplate.
#
# crates.io trusts this repository AND this workflow filename, so renaming the
# file breaks publishing until the trusted publisher is updated to match.

# NOTE: this workflow cannot perform the FIRST publish. Unlike PyPI, crates.io
# has no pending-publisher concept — a trusted publisher can only be attached
# to a crate that already exists, so v0.1.0 goes out once by hand with a
# scoped API token and every release after that runs here.
on:
  push:
    tags: ["v*"]
  # Manual re-runs (a failed publish step, a re-release of the same tag).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      # This crate is also a member of the closed app workspace, where
      # `workspace = true` inheritance would resolve. Checked out alone it has
      # no workspace above it — the same shape a `cargo add --git` consumer
      # gets — so a manifest that only works inside the workspace fails here
      # rather than shipping broken.
      - name: Manifest resolves with no workspace above it
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Build and test
        run: |
          cargo build --all-features
          cargo test --all-features

      # A tag that disagrees with Cargo.toml publishes a version nobody asked
      # for, and a crates.io release cannot be replaced — only yanked.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['packages'][0]['version'])")
          if [ "$tag" != "$packaged" ]; then
            echo "tag $tag != Cargo.toml version $packaged" >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
