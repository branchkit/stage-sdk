[package]
name = "branchkit-stage-sdk"
version = "0.1.0"
edition = "2024"
# Implied by edition 2024, stated because this crate is published: an unstated
# MSRV reaches a consumer on an older toolchain as a wall of syntax errors
# instead of "requires rustc 1.85".
rust-version = "1.85"
license = "MIT"
description = "BranchKit pipeline stage SDK: wire framing, event vocabulary, stage runtime, and stage logging for out-of-tree pipeline stages"
repository = "https://github.com/branchkit/stage-sdk"
readme = "README.md"
keywords = ["branchkit", "pipeline", "stage", "sdk"]
categories = ["api-bindings"]

[features]
# Schema emission only — stage consumers never need this. The emit binary
# regenerates contracts/pipeline.json (gated by `just check-stage-gen`).
schema = ["dep:schemars"]

[[bin]]
name = "emit-pipeline-schema"
path = "src/bin/emit_pipeline_schema.rs"
required-features = ["schema"]

[[bin]]
name = "emit-stage-sdk"
path = "src/bin/emit_stage_sdk.rs"
required-features = ["schema"]

# Concrete versions, NOT `workspace = true`. This crate is published and is
# consumed by out-of-tree stages, so its manifest has to resolve on its own:
# inherited deps only resolve inside the app workspace, which made a clone or
# a `cargo add --git` of this repo fail to parse the manifest at all — the
# exact consumption path the split-out was for. Kept in step with the app
# workspace's versions by `just check-stage-sdk-standalone`.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
getrandom = "0.2"
schemars = { version = "1", optional = true }
